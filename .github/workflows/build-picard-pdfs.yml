name: Compile Picard research PDFs
on:
  push:
    branches: [main]
    paths:
      - 'docs/library/01_Core_Theory/Picard/The_Geometry_of_Mathematical_Obstruction_001v2.tex'
      - 'docs/library/01_Core_Theory/Picard/Depths_of_a_Possible_Machine_001.tex'
      - '.github/workflows/build-picard-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research sources
        uses: actions/checkout@v4
      - name: Compile the two original LaTeX articles
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            docs/library/01_Core_Theory/Picard/The_Geometry_of_Mathematical_Obstruction_001v2.tex
            docs/library/01_Core_Theory/Picard/Depths_of_a_Possible_Machine_001.tex
          work_in_root_file_dir: true
      - name: Commit compiled PDFs to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f 'docs/library/01_Core_Theory/Picard/The_Geometry_of_Mathematical_Obstruction_001v2.pdf' 'docs/library/01_Core_Theory/Picard/Depths_of_a_Possible_Machine_001.pdf'
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled Picard article PDFs"
            git push
          fi
